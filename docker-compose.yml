services:
  app:
    build: .
    container_name: verdemar-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - verdemar-net

  mysql:
    image: mysql:8
    container_name: verdemar-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - verdemar-db:/var/lib/mysql
    networks:
      - verdemar-net

volumes:
  verdemar-db:

networks:
  verdemar-net:
