services:
  # ---------------------
  # Backend (Spring Boot)
  # ---------------------
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   container_name: verdemar-backend-dev
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./src:/app/src
  #     - ./pom.xml:/app/pom.xml
  #     - ./mvnw:/app/mvnw
  #   env_file:
  #     - .env
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/verdemar
  #     SPRING_DATASOURCE_USERNAME: root
  #     SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
  #     STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}   # ← Asegúrate de definirlo en tu .env

  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - verdemar
  #   restart: on-failure


  # ---------------------
  # Frontend (Next.js)
  # ---------------------
  frontend:
    image: verdemar-app-frontend
    container_name: verdemar-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080  # URL del backend
    networks:
      - verdemar
    restart: on-failure
  # ---------------------
  # Base de datos (MySQL)
  # ---------------------
  mysql:
    image: mysql:latest
    container_name: verdemar-mysql
    restart: on-failure
    ports:
      - "3306:3306"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - verdemar-db-dev:/var/lib/mysql
    networks:
      - verdemar

# ---------------------
# Volúmenes persistentes
# ---------------------
volumes:
  verdemar-db-dev:

# ---------------------
# Redes
# ---------------------
networks:
  verdemar:
    driver: bridge
