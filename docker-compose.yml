backend:
  build:
    context: .
    dockerfile: Dockerfile.dev
  container_name: verdemar-backend-dev
  ports:
    - "8080:8080"
  volumes:
    - ./src:/app/src
    - ./pom.xml:/app/pom.xml
    - ./mvnw:/app/mvnw
  environment:
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/verdemar
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - verdemar
  restart: on-failure
